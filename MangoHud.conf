# MangoHud.conf — Beelink GTR9 Pro · Radeon 8060S (Strix Halo, gfx1151) · CachyOS Wayland · RADV
# Readout-only HUD. Requires MangoHud >= 0.8.4, kernel >= 6.14, RADV (Mesa 24+).

# ─── Layout ───────────────────────────────────────────────────────────────────
horizontal                          # single top-of-screen row
legacy_layout=0                     # render in the element order written below
position=top-left                   # top-center / top-right to move along the edge

# ─── FPS ──────────────────────────────────────────────────────────────────────
fps                                 # current frame rate
frametime                           # frametime in ms, inline with FPS
frame_timing                        # frametime line graph
fps_metrics=avg,0.01,0.001          # average + 1% + 0.1% low FPS

# ─── GPU ──────────────────────────────────────────────────────────────────────
gpu_stats                           # GPU load %
gpu_temp                            # GPU edge temperature
gpu_core_clock                      # GPU core clock
gpu_power                           # GPU package power, watts

# ─── CPU ──────────────────────────────────────────────────────────────────────
cpu_stats                           # CPU load %
cpu_mhz                             # CPU frequency (highest active core)
cpu_temp                            # CPU temperature

# ─── Memory (unified LPDDR5X pool) ────────────────────────────────────────────
vram                                # GPU VRAM (BIOS UMA carveout only, not the full pool)
ram                                 # CPU-side usage of the shared pool

# ─── Style ────────────────────────────────────────────────────────────────────
font_size=20
background_alpha=0.4
text_outline

# ─── Keybind ──────────────────────────────────────────────────────────────────
toggle_hud=Shift_R+F12

# ─── Optional (uncomment to enable) ───────────────────────────────────────────
# throttling_status                 # throttle flags read N/A on this APU; opt-in
# core_load                         # per-core load; informative but verbose
