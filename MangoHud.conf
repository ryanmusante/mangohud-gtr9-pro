# MangoHud.conf — Beelink GTR9 Pro / Radeon 8060S (Strix Halo) / CachyOS Wayland / RADV
horizontal
position=top-left
fps
fps_metrics=avg,1,0.1
frametime
frame_timing
gpu_stats
gpu_core_clock
# gpu_mem_clock and gpu_mem_temp also require vram (enabled below) per upstream
gpu_mem_clock
gpu_temp
gpu_mem_temp
resolution
cpu_stats
cpu_mhz
cpu_temp
vram
ram
swap
font_size=20
background_alpha=0.4
text_outline
toggle_hud=Shift_R+F12
