# MangoHud.conf — Beelink GTR9 Pro / Ryzen AI Max+ 395 / Radeon 8060S (Strix Halo, gfx1151)
# Target: CachyOS Wayland, RADV, MangoHud >= 0.8.3, kernel >= 6.14

# Layout & positioning -------------------------------------------------------
legacy_layout=0
horizontal
position=top-left
table_columns=20
horizontal_stretch
hud_no_margin
cellpadding_y=-0.085
round_corners=8

# Typography -----------------------------------------------------------------
font_size=22
text_outline
text_outline_color=000000
text_outline_thickness=1.5

# Transparency ---------------------------------------------------------------
background_alpha=0.55
background_color=000000
alpha=1.0

# FPS ------------------------------------------------------------------------
fps
fps_sampling_period=500
fps_metrics=avg,0.01,0.001
fps_color_change
fps_value=30,60
fps_color=ED1C24,FDFD09,39F900
frame_count
frame_timing
frametime
dynamic_frame_timing
throttling_status_graph

# GPU — Radeon 8060S (gfx1151, RDNA 3.5) -------------------------------------
gpu_text=iGPU
gpu_stats
gpu_load_change
gpu_load_value=50,90
gpu_load_color=39F900,FDFD09,ED1C24
gpu_temp
gpu_junction_temp
gpu_mem_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_voltage
throttling_status
gpu_color=ED1C24

# CPU — Ryzen AI Max+ 395 (16C/32T Zen 5) ------------------------------------
cpu_stats
cpu_load_change
cpu_load_value=50,90
cpu_load_color=39F900,FDFD09,ED1C24
cpu_temp
cpu_mhz
cpu_power
cpu_color=00E5E5

# Memory — UMA-aware ---------------------------------------------------------
vram
vram_color=AD64C1
ram
ram_color=C26693
swap
proc_vram

# Engine / Wine / Vulkan -----------------------------------------------------
engine_version
engine_short_names
engine_color=EB5B5B
vulkan_driver
wine
wine_color=EB5B5B
winesync
arch
exec_name
present_mode
resolution
display_server

# Status indicators ----------------------------------------------------------
gamemode
vkbasalt
time
time_format=%H:%M

# FPS limiter ----------------------------------------------------------------
fps_limit=0,240,144,60,30
# gamescope#1917: early causes VRR spikes in gamescope's Wayland backend.
fps_limit_method=late
show_fps_limit

# Keybinds -------------------------------------------------------------------
toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
toggle_preset=Shift_R+F10
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
upload_log=Shift_L+F3
reload_cfg=Shift_L+F4
reset_fps_metrics=Shift_R+F9

# Logging --------------------------------------------------------------------
# Replace USERNAME — MangoHud does not expand ~ in older versions:
#   sed -i "s|/home/USERNAME/mangologs|$HOME/mangologs|" ~/.config/MangoHud/MangoHud.conf
output_folder=/home/USERNAME/mangologs
log_interval=100
log_duration=60
permit_upload=1
benchmark_percentiles=97,AVG,1,0.1

# Quality-of-life ------------------------------------------------------------
blacklist=protonplus,zenity,steam,steamwebhelper,Cargo.exe,gamescope-session,steamcompmgr
