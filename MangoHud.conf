# MangoHud.conf — Beelink GTR9 Pro / Radeon 8060S (Strix Halo) / CachyOS Wayland / RADV
# Horizontal top-of-screen bar — most-popular minimal layout, with temperatures.

# Layout — single horizontal row, top of screen
horizontal
position=top-left

# FPS + frame timing
fps
frametime
frame_timing

# GPU — load + temperature
gpu_stats
gpu_temp

# CPU — load + temperature
cpu_stats
cpu_temp

# Memory (unified/UMA) — VRAM + system RAM
vram
ram

# Style
font_size=20
background_alpha=0.4
text_outline

# Toggle
toggle_hud=Shift_R+F12
