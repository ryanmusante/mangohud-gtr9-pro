# MangoHud.conf — Beelink GTR9 Pro / Ryzen AI Max+ 395 / Radeon 8060S (Strix Halo, gfx1151)
# Target: CachyOS Wayland, RADV, MangoHud >= 0.8.3, kernel >= 6.14
# Layout: horizontal status bar, top-left anchor — chosen because horizontal reads fastest
# at a glance during gameplay and top-left avoids most HUD/minimap overlap in modern games.

# ---------------------------------------------------------------------------
# Layout & positioning
# ---------------------------------------------------------------------------

# Modern flag-based layout — required for horizontal, custom_text, exec, fps_metrics to work.
legacy_layout=0

# Single-row bar — the whole point of this config; avoids vertical screen real estate cost.
horizontal

# Top-left so it doesn't fight with crosshairs (center) or chat/scoreboards (right).
position=top-left

# 20 columns gives a clean single-line layout at 4K and a 2-line wrap at 1440p without truncation.
# Issue #1101 confirms this is the post-0.7 supported way to control horizontal width.
table_columns=20

# Stretch the dim background across the screen so the bar reads as a unified strip, not 20 islands.
horizontal_stretch

# Trim the inner cell padding so the bar is visually thinner — UMA APUs care about pixel density.
hud_no_margin
cellpadding_y=-0.085

# Soften the corners — pure cosmetic; 8 px matches default KDE/GNOME chrome.
round_corners=8

# ---------------------------------------------------------------------------
# Typography — 4K-friendly, neutral, non-licensed font default
# ---------------------------------------------------------------------------

# 22 px is the sweet spot at 4K for ~1.5 m viewing distance; bump to 26 if you sit closer.
font_size=22

# Override the auto-computed secondary size (default = 0.55 * font_size ≈ 12 at font_size=22).
# Only uncomment to override the default ratio for unit labels (°C, MHz, etc.).
# font_size_secondary=14

# Black 1.5 px outline so the bar is legible over both bright sky and dark dungeon scenes.
text_outline
text_outline_color=000000
text_outline_thickness=1.5

# Pick a font present on CachyOS by default; uncomment to use a Nerd/Jetbrains font if installed.
# font_file=/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf

# ---------------------------------------------------------------------------
# Transparency — readable without burning the screen
# ---------------------------------------------------------------------------

# 0.55 backdrop is dark enough for legibility on bright HDR scenes but not opaque.
background_alpha=0.55
background_color=000000

# Keep all text and graphs at full opacity — dimming foreground hurts the frametime graph.
alpha=1.0

# ---------------------------------------------------------------------------
# FPS — the headline number plus competitive low-percentile metrics
# ---------------------------------------------------------------------------

# FPS is on by default but listing it explicitly documents intent and survives a `full` reset.
fps

# 500 ms sampling matches RTSS/MSI Afterburner conventions; lower flickers, higher hides stutters.
fps_sampling_period=500

# AVG / 1% low / 0.1% low — the three numbers Hardware Unboxed and Digital Foundry use.
# Decimal form is mandatory: 0.01 = 1% low, 0.001 = 0.1% low (issue #1957).
# Lowercase `avg` matches the upstream MangoHud.conf example exactly.
fps_metrics=avg,0.01,0.001

# Color-grade the FPS number: red below 30, yellow under 60, green above. Tunable per game.
fps_color_change
fps_value=30,60
fps_color=ED1C24,FDFD09,39F900

# Show the running frame count next to FPS — useful for matching against in-game benchmark scenes.
frame_count

# Frametime graph is the most important diagnostic on Linux; spikes show shader-comp stutter.
frame_timing
frametime

# Auto-rescale the graph y-axis when frametime spikes — easier to see microstutter on high-FPS panels.
dynamic_frame_timing

# More-detailed frametime graph with min/max bars; uncomment when investigating microstutter.
# frame_timing_detailed

# Overlay throttle events (power/temp) on the frametime graph itself — invaluable on Strix Halo
# where the iGPU shares a power budget with 16 Zen 5 cores.
throttling_status_graph

# ---------------------------------------------------------------------------
# GPU — Radeon 8060S (gfx1151, RDNA 3.5)
# ---------------------------------------------------------------------------

# Label clearly: this is the integrated GPU sharing the 128 GB pool, not a discrete card.
gpu_text=iGPU
gpu_stats

# Color-code GPU load: green idle, amber moderate, AMD red at full pin (50/90 thresholds).
gpu_load_change
gpu_load_value=50,90
gpu_load_color=39F900,FDFD09,ED1C24

# Edge temp is the historic AMD reading; junction (hotspot) is what actually triggers throttle on RDNA.
gpu_temp
gpu_junction_temp

# Memory temp matters less on UMA (it's just LPDDR5x), but it's exposed and free to display.
gpu_mem_temp

# Core clock = current shader engine frequency; mem_clock here is the LPDDR5x memory controller speed.
gpu_core_clock
gpu_mem_clock

# Power in W — on Strix Halo this is the GFX rail only; total package power comes from cpu_power.
gpu_power

# Voltage is AMD-only and useful for diagnosing under-volting tweaks on the iGPU.
gpu_voltage

# Show throttle reason (Power / Temp / Current / Other) only when actively throttling.
throttling_status

# AMD red for GPU column — matches Adrenalin/Radeon brand and is high-contrast against dark bg.
gpu_color=ED1C24

# GPU power limit (TDP cap). On Strix Halo this often reads as the iGPU's share of the package
# power budget; uncomment if you're tuning amd_pstate / sysfs power profiles.
# gpu_power_limit

# GPU fan rpm — Strix Halo has a unified system fan controlled by the platform/EC, not amdgpu;
# this typically reads 0 on APUs. Uncomment only if you've confirmed amdgpu exposes pwm1.
# gpu_fan

# Explicit GPU model string — useful to confirm the right device when multiple GPUs are present.
# gpu_name

# Joules-per-frame efficiency. Interesting on a UMA APU where CPU and GPU share a power budget;
# pair with cpu_efficiency to see total system efficiency, or flip_efficiency for the inverse.
# gpu_efficiency
# cpu_efficiency
# flip_efficiency

# ---------------------------------------------------------------------------
# CPU — Ryzen AI Max+ 395 (16C/32T Zen 5)
# ---------------------------------------------------------------------------

# Aggregate CPU load is the right default for 16C/32T — per-core would consume half the bar width.
cpu_stats

cpu_load_change
cpu_load_value=50,90
cpu_load_color=39F900,FDFD09,ED1C24

# Package temp; CachyOS ships k10temp by default which exposes Tctl correctly on Zen 5.
cpu_temp

# Highest current core MHz (per upstream 0.6.7 change) — tells you boost behavior at a glance.
cpu_mhz

# Package power via RAPL — works on Zen 5 if /sys/class/powercap/intel-rapl:0/energy_uj is readable.
# If you see 0 W, run as root once: chmod o+r /sys/class/powercap/intel-rapl\:0/energy_uj
# (CachyOS gaming-meta usually handles this; see RAPL note in upstream README).
cpu_power

# RTX-cyan tone for CPU column — distinct from AMD red GPU column without being garish.
cpu_color=00E5E5

# Per-core grid is heavy on 32 threads; uncomment only when you're hunting a thread-pin bug.
# core_load
# core_load_change
# core_bars
# core_type

# ---------------------------------------------------------------------------
# Memory — UMA-aware: vram alone is misleading on Strix Halo
# ---------------------------------------------------------------------------

# vram on Strix Halo reflects only the BIOS-carved VRAM window (typically 0.5–96 GB depending
# on amdttm.pages_limit / BIOS UMA setting). It does NOT show the GTT-backed shared pool.
# Source: ROCm issue #5444, ollama #12062, AMD ROCm docs (Strix Halo system optimization).
# Therefore we display vram, ram, AND swap so total memory pressure is always visible.
vram
vram_color=AD64C1

ram
ram_color=C26693

# 128 GB system means swap should be near-zero; if it climbs, something is very wrong.
swap

# Process-level VRAM (per-pid via fdinfo) — useful to attribute usage to the game vs Steam/Discord.
proc_vram

# DDR5 RAM temperature via spd5118 driver (added in MangoHud 0.8.3); free if your kernel module loads.
# ram_temp

# ---------------------------------------------------------------------------
# Engine / Wine / Vulkan diagnostics — always-on for Proton debugging
# ---------------------------------------------------------------------------

# Vulkan/OpenGL/DXVK/VKD3D version string — first thing to check when Proton acts up.
engine_version
engine_short_names
engine_color=EB5B5B

# Print "RADV MESA xx.y.z" so you can confirm which Vulkan ICD actually got loaded.
vulkan_driver

# Wine/Proton version — surfaces proton-cachyos vs Experimental at a glance.
wine
wine_color=EB5B5B

# Sync method (esync/fsync/ntsync). User has PROTON_USE_NTSYNC=1, so this should read "ntsync".
winesync

# 32 vs 64-bit — older games still ship 32-bit binaries through lib32-mangohud.
arch

# Underlying executable name; helps when a game spawns multiple processes.
exec_name

# Vulkan present mode (FIFO / MAILBOX / IMMEDIATE) — confirms whether vsync took effect.
present_mode

# Render resolution — catches games rendering at 1080p when you expected 4K.
resolution

# Wayland vs X11 — flagged because some Proton games still fall back to XWayland silently.
display_server

# ---------------------------------------------------------------------------
# Status indicators
# ---------------------------------------------------------------------------

# Show "GAMEMODE" badge — confirms gamemoderun / cachyos-gaming-meta integration is active.
gamemode

# Show "VKBASALT" badge — confirms post-process shaders (CAS/FXAA) are loaded.
vkbasalt

# Show MangoHud's own version — handy when reporting bugs upstream.
# version

# Local clock; useful in benchmark videos and for time-correlating logs to dmesg.
time
time_format=%H:%M
# time_no_label

# ---------------------------------------------------------------------------
# FPS limiter — late = lowest latency (default), early = smoothest
# ---------------------------------------------------------------------------

# Cycle list: unlimited, 240 (high-refresh competitive), 144, 60 (cinematic), 30 (fanless).
# Toggle with Shift_L+F1.
fps_limit=0,240,144,60,30

# late is upstream default and what gamescope+VRR want; early causes frametime spikes on Wayland
# under VRR (gamescope issue #1917).
fps_limit_method=late

# Show the active limit in the HUD so you know which mode you're in.
show_fps_limit

# Vulkan vsync: 0=adaptive, 1=off, 2=mailbox, 3=on. Off is the right default for VRR displays.
# vsync=1
# gl_vsync=0

# ---------------------------------------------------------------------------
# Keybinds — chosen to avoid Steam (Shift+Tab) and Discord (Ctrl+Shift+*)
# ---------------------------------------------------------------------------

toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
toggle_preset=Shift_R+F10
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
upload_log=Shift_L+F3
reload_cfg=Shift_L+F4
reset_fps_metrics=Shift_R+F9

# ---------------------------------------------------------------------------
# Logging — FlightlessMango.com benchmark-quality CSVs
# ---------------------------------------------------------------------------

# Replace USERNAME below with your real username — MangoHud does NOT expand ~ in older versions.
# fish: sed -i "s|/home/USERNAME/mangologs|$HOME/mangologs|" ~/.config/MangoHud/MangoHud.conf
output_folder=/home/USERNAME/mangologs

# 100 ms = 10 Hz, the rate flightlessmango.com and mangoplot expect. 0 = log every frame (huge files).
log_interval=100

# 60 s benchmark window — long enough for 1% lows to converge, short enough to repeat 5x in a session.
log_duration=60

# Auto-start log N seconds after MangoHud init. Leave commented for manual Shift_L+F2 control.
# autostart_log=5

# Enable Shift_L+F3 → upload latest log to flightlessmango.com.
permit_upload=1

# Default percentile set rendered by flightlessmango.com (don't change unless you're not uploading).
benchmark_percentiles=97,AVG,1,0.1

# Adds CPU/GPU/driver/kernel headers to the CSV. NOT compatible with flightlessmango.com upload yet,
# so leave commented if you upload. Enable for local mangoplot use.
# log_versioning

# ---------------------------------------------------------------------------
# Quality-of-life
# ---------------------------------------------------------------------------

# Don't load the HUD into apps where it just gets in the way.
blacklist=protonplus,zenity,steam,steamwebhelper,Cargo.exe,gamescope-session,steamcompmgr

# ---------------------------------------------------------------------------
# Intentionally OFF (documented why)
# ---------------------------------------------------------------------------

# histogram — extra ImGui draw cost, redundant with frame_timing graph.
# media_player — DBus polling adds overhead, irrelevant for gaming.
# network — polls every interface unless you specify one; noisy on a multi-NIC mini PC.
# io_read / io_write — interesting only when you suspect disk-bound stutter; off by default.
# fsr / hdr / refresh_rate / debug — gamescope-only; harmless but noisy under bare Wayland.
# fcat — frame capture analysis only useful with external capture HW.
# device_battery / battery — desktop mini PC, no battery.
# fan — Steam Deck fan path; Strix Halo's unified fan is platform/EC-controlled, not amdgpu.
# temp_fahrenheit — Celsius is the lab standard.
