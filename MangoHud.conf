# MangoHud.conf — Beelink GTR9 Pro · Radeon 8060S (Strix Halo, gfx1151) · CachyOS Wayland · RADV

### Layout
horizontal
legacy_layout=0
position=top-left

### Control
toggle_hud=Shift_R+F12

### FPS
fps
frametime
frame_timing

### GPU
gpu_stats
gpu_temp
gpu_core_clock
gpu_power

### CPU
cpu_stats
cpu_temp
cpu_custom_temp_sensor=k10temp,temp1_input
cpu_mhz
cpu_power

### Memory
vram
ram

### Style
font_size=20
text_outline
background_alpha=0.4
