################################################################################
# MangoHud.conf
# Beelink GTR9 Pro · Radeon 8060S (Strix Halo, gfx1151) · CachyOS Wayland · RADV
################################################################################

# ─── Layout ───────────────────────────────────────────────────────────────────
horizontal                       # single top-of-screen row
legacy_layout=0                  # render in the element order written below
position=top-left                # top-center / top-right to move along the edge

# ─── FPS ──────────────────────────────────────────────────────────────────────
fps                              # current frame rate (+ frametime, below)
frametime                        # frametime in ms, inline with FPS
frame_timing                     # frametime line graph (stutter spikes)

# ─── GPU ──────────────────────────────────────────────────────────────────────
gpu_stats                        # GPU load %
gpu_temp                         # GPU edge temperature
gpu_core_clock                   # GPU core clock

# ─── CPU ──────────────────────────────────────────────────────────────────────
cpu_stats                        # CPU load %
cpu_mhz                          # CPU frequency

# ─── Memory (unified LPDDR5X pool) ────────────────────────────────────────────
vram                             # GPU-side usage of the shared pool
gpu_mem_clock                    # memory clock         (rendered with VRAM; needs vram)
ram                              # CPU-side usage of the shared pool
swap                             # swap usage           (rendered with RAM)

# ─── Style ────────────────────────────────────────────────────────────────────
font_size=20
background_alpha=0.4
text_outline

# ─── Keybind ──────────────────────────────────────────────────────────────────
toggle_hud=Shift_R+F12
